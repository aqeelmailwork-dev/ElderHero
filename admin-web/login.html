<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ElderHero Admin Login</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="logo-wrapper">
        <img src="images/elderhero.png" alt="ElderHero Logo" class="logo">
      </div>
      
      <h1>Admin Portal</h1>
      <p class="subtitle">Please sign in to continue</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="admin@elderhero.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <div id="errorMessage" class="error-message" aria-live="polite"></div>

        <button type="submit" id="loginBtn" class="btn-primary">
          <span class="btn-text">Sign In</span>
          <span class="loader hidden"></span>
        </button>
      </form>
    </div>
    
    <footer class="login-footer">
      &copy; <span id="year"></span> ElderHero. All rights reserved.
    </footer>
  </div>

  <script type="module" src="login.js"></script>
</body>
</html>
